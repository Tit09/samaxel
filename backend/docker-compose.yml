# Déploiement complet : API + PostgreSQL + Redis (réseau privé, seul le port de l'API est exposé)
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: [redisdata:/data]
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: production
      TRUST_PROXY: "true"
    volumes: ["./keys:/app/keys:ro"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["127.0.0.1:3001:3001"]   # Nginx (TLS) devant, sur la même machine
volumes:
  pgdata:
  redisdata:
